<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story, a life in chapters</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --paper:#ede5d6;
  --paper2:#fbf7ed;
  --ink:#201c17;
  --muted:#72695d;
  --rule:#cfc3b1;
  --olive:#52614a;
  --olive-soft:#e1e7dd;
  --terracotta:#ad5941;
  --terracotta-soft:#eeded6;
  --gold:#ae873f;
  --gold-soft:#efe2c9;
  --blue:#6d7e83;
  --signal-red:#cf2d22;
  --poster-yellow:#f2cf35;
  --poster-blue:#315da8;
  --poster-cyan:#2f8991;
  --poster-orange:#df6a2d;
  --shadow:0 16px 42px rgba(47,35,22,.12);
  --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.35), transparent 32%),
    radial-gradient(circle at 80% 60%, rgba(173,145,95,.08), transparent 34%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
a{text-decoration:none;color:inherit}

.app{min-height:100vh}
.topbar{
  height:70px;
  border-bottom:1px solid var(--rule);
  background:rgba(246,241,232,.92);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--serif);
  font-size:21px;
  font-weight:700;
  letter-spacing:-.03em;
}
.brand-mark{
  width:31px;height:31px;border:1.5px solid var(--ink);
  border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-family:var(--sans);font-weight:900;
}
.top-actions{display:flex;gap:8px}
.btn{
  border:1px solid var(--rule);
  background:var(--paper2);
  color:var(--ink);
  border-radius:10px;
  padding:9px 13px;
  font-weight:760;
}
.btn:hover{background:#f5efe4}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ink-outline{background:transparent;border-color:var(--ink)}
.btn.text{background:transparent;border-color:transparent;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px)}
aside{
  border-right:1px solid var(--rule);
  padding:24px 16px;
  background:rgba(246,241,232,.52);
}
.aside-kicker{
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.19em;
  color:var(--muted);
  margin:4px 10px 13px;
}
.story-nav{display:flex;flex-direction:column;gap:3px}
.story-nav button{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  border-radius:9px;
  padding:10px;
  display:flex;align-items:center;gap:9px;
  color:var(--ink);
}
.story-nav button:hover{background:rgba(255,255,255,.36)}
.story-nav button.active{background:var(--ink);color:#fff}
.nav-icon{width:25px;flex:0 0 25px}
.nav-name{font-weight:720;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-main{font-size:10px;color:var(--gold);font-weight:900}
.story-nav button.active .nav-main{color:#efcf8d}
main{max-width:1180px;width:100%;margin:0 auto;padding:34px 36px 70px}
.eyebrow{
  font-size:10px;text-transform:uppercase;letter-spacing:.2em;
  font-weight:900;color:var(--muted);
}
.serif-title{font-family:var(--serif);letter-spacing:-.045em}
.home-hero{
  display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;align-items:end;
  margin-bottom:28px;
}
.home-hero h1{font-size:clamp(46px,7vw,78px);line-height:.94;margin:7px 0 0;max-width:760px}
.hero-note{font-family:var(--serif);font-size:17px;color:var(--muted);margin:13px 0 0;max-width:670px;line-height:1.4}
.north-star{
  background:var(--ink);color:#fff;padding:22px 20px;border-radius:2px;position:relative;
  box-shadow:var(--shadow);min-height:135px;display:flex;flex-direction:column;justify-content:space-between;
}
.north-star:after{
  content:"";position:absolute;right:14px;top:14px;width:36px;height:36px;border:1px solid rgba(255,255,255,.35);
  transform:rotate(45deg);
}
.north-star .eyebrow{color:#d9d1c2}
.north-star-text{font-family:var(--serif);font-size:22px;line-height:1.18;padding-right:34px}
.north-star-edit{align-self:flex-start;border:0;background:transparent;color:#d8cbb7;padding:0;font-size:12px;font-weight:800}
.section-rule{display:flex;align-items:center;gap:12px;margin:34px 0 15px}
.section-rule span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:900;white-space:nowrap}
.section-rule:after{content:"";height:1px;background:var(--rule);flex:1}
.main-story{
  display:grid;grid-template-columns:1.08fr .92fr;gap:0;
  background:var(--paper2);border:1px solid var(--rule);box-shadow:var(--shadow);
  min-height:275px;
}
.main-story-left{padding:26px 26px 24px;background:linear-gradient(135deg,#f7f1e5,#eee5d5);border-right:1px solid var(--rule)}
.main-story-right{padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.story-badge{
  display:inline-flex;align-items:center;gap:7px;border:1px solid #cfc3ad;
  padding:5px 8px;border-radius:2px;font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;
  background:#f8f1e3;
}
.story-badge .star{color:var(--gold)}
.main-story h2{font-family:var(--serif);font-size:52px;line-height:.98;margin:16px 0 8px;letter-spacing:-.05em}
.story-subline{color:var(--muted);font-size:13px;max-width:500px}
.goal-feature{margin-top:22px;border-top:1px solid rgba(120,107,88,.25);padding-top:14px}
.goal-label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--muted)}
.goal-feature h3{font-family:var(--serif);font-size:25px;line-height:1.05;margin:7px 0 0;letter-spacing:-.035em}
.goal-target{font-size:12px;color:var(--muted);margin-top:5px}
.main-story-right .mini-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.step-teaser{
  border-top:1px solid var(--rule);
  padding-top:13px;margin-top:10px;
}
.step-line{
  display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ece5d9;
}
.step-line:last-child{border-bottom:0}
.step-title{font-weight:760;font-size:13px}
.open-story{
  align-self:flex-start;border:0;background:transparent;padding:0;color:var(--ink);
  font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;
}
.open-story:hover{text-decoration:underline;text-underline-offset:4px}

.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.story-card{
  background:rgba(255,253,248,.82);border-top:4px solid var(--olive);
  padding:17px 17px 15px;min-height:190px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  position:relative;transition:.18s;display:flex;flex-direction:column;
}
.story-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.story-card .card-icon{font-size:25px}
.story-card h3{font-family:var(--serif);font-size:29px;line-height:1;margin:13px 0 5px;letter-spacing:-.04em}
.story-card .card-goal-label{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:900}
.story-card .card-goal{font-family:var(--serif);font-size:18px;line-height:1.12;margin-top:4px}
.card-footer{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:auto;padding-top:18px}
.card-journey{font-size:11px;color:var(--muted)}
.card-open{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}

.story-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.back{display:none}
.story-head-icon{width:58px;height:58px;display:grid;place-items:center;font-size:30px;background:#e4dccd;border:1px solid #cfc5b5}
.story-head h1{font-family:var(--serif);font-size:58px;line-height:.95;letter-spacing:-.055em;margin:3px 0 5px}
.story-head-meta{font-size:12px;color:var(--muted)}
.story-head-actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.panel{
  background:rgba(255,253,248,.86);
  border:1px solid var(--rule);
  padding:22px;
  box-shadow:0 5px 14px rgba(44,37,26,.025);
}
.goal-hero-panel{margin-bottom:15px}
.goal-hero-panel h2{font-family:var(--serif);font-size:34px;letter-spacing:-.04em;margin:5px 0 4px}
.goal-hero-panel .goal-target{font-size:13px}
.goal-row{display:flex;justify-content:space-between;gap:16px;align-items:end}
.story-cols{display:grid;grid-template-columns:1.08fr .92fr;gap:15px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.section-title h2{font-family:var(--serif);font-size:27px;letter-spacing:-.035em;margin:3px 0 0}
.section-title .kicker{font-size:9px;text-transform:uppercase;letter-spacing:.17em;color:var(--muted);font-weight:900}
.step-list{display:flex;flex-direction:column}
.step{
  display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
  border-top:1px solid #e7dfd3;padding:13px 0;
}
.step:first-child{border-top:0;padding-top:0}
.step-trigger{
  width:29px;height:29px;border-radius:50%;border:1px solid #bcae98;background:#f8f2e7;
  display:grid;place-items:center;color:var(--ink);font-weight:900;
}
.step-trigger:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.step-copy{min-width:0}
.step h4{margin:0;font-size:14px}
.step-meta{font-size:11px;color:var(--muted);margin-top:3px}
.step-empty{
  border:1px dashed #cfc5b4;padding:20px 15px;text-align:center;background:#faf6ee;
}
.step-empty .empty-title{font-family:var(--serif);font-size:20px}
.step-empty p{color:var(--muted);font-size:12px;margin:5px auto 12px;max-width:280px}
.add-step-row{display:flex;gap:7px;margin-top:12px}
.add-step-row input{
  flex:1;border:1px solid var(--rule);background:#fff;padding:10px 11px;border-radius:8px;
}
.chapter-list,.goal-list{display:flex;flex-direction:column}
.list-item{border-top:1px solid #e7dfd3;padding:12px 0}
.list-item:first-child{border-top:0;padding-top:0}
.list-title{font-family:var(--serif);font-size:19px;line-height:1.05}
.list-meta{font-size:11px;color:var(--muted);margin-top:4px}
.journey{margin-top:15px}
.journey-track{position:relative;padding-left:24px}
.journey-track:before{content:"";position:absolute;left:6px;top:4px;bottom:5px;width:1px;background:#cfc4b4}
.journal-entry{position:relative;padding:0 0 19px}
.journal-entry:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--terracotta);box-shadow:0 0 0 3px var(--paper2)}
.journal-date{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}
.journal-note{font-family:var(--serif);font-size:20px;line-height:1.12;margin:4px 0}
.journal-meta{font-size:11px;color:var(--muted)}
.north-star-edit-btn{font-size:12px}

.modal-backdrop{position:fixed;inset:0;background:rgba(25,21,17,.52);display:none;align-items:center;justify-content:center;padding:17px;z-index:60}
.modal-backdrop.open{display:flex}
.modal{width:min(620px,100%);background:var(--paper2);border:1px solid var(--rule);box-shadow:0 28px 90px rgba(0,0,0,.27);padding:23px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.modal h2{font-family:var(--serif);font-size:30px;letter-spacing:-.04em;margin:0}
.close{border:1px solid var(--rule);background:#f1eadf;width:33px;height:33px;border-radius:50%;font-size:18px}
.field{margin:13px 0}
.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:900;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--rule);background:#fff;padding:11px;border-radius:8px;color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 15px;font-size:12px;font-weight:800;z-index:90;transition:.2s;border-radius:9px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.step-stamp{
  position:fixed;left:50%;top:94px;transform:translate(-50%,-8px) rotate(-2deg) scale(.98);opacity:0;pointer-events:none;
  border:2px solid var(--terracotta);color:var(--terracotta);background:rgba(250,244,234,.94);
  padding:11px 15px 9px;text-align:center;z-index:85;transition:.2s;box-shadow:0 10px 26px rgba(60,42,27,.13)
}
.step-stamp.show{opacity:1;transform:translate(-50%,0) rotate(-2deg) scale(1)}
.step-stamp strong{display:block;font-family:var(--serif);font-size:20px;line-height:1}
.step-stamp span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin-top:4px}

@media(max-width:900px){
  .topbar{height:auto;min-height:64px;padding:10px 13px}
  .layout{grid-template-columns:1fr}
  aside{display:none}
  main{padding:23px 13px 55px}
  .home-hero{grid-template-columns:1fr;gap:18px}
  .home-hero h1{font-size:56px}
  .main-story{grid-template-columns:1fr}
  .main-story-left{border-right:0;border-bottom:1px solid var(--rule)}
  .story-grid{grid-template-columns:1fr}
  .story-cols{grid-template-columns:1fr}
  .back{display:inline-flex;order:-1}
  .story-head{align-items:center}
  .story-head h1{font-size:48px}
}
@media(max-width:560px){
  .brand{display:none}
  .top-actions{width:100%}
  .top-actions .btn{flex:1;padding:10px 8px}
  .home-hero h1{font-size:47px}
  .north-star-text{font-size:20px}
  .main-story h2{font-size:45px}
  .main-story-left,.main-story-right{padding:21px}
  .panel{padding:18px}
  .goal-row{align-items:flex-start;flex-direction:column;gap:5px}
  .story-head{gap:11px}
  .story-head-icon{width:51px;height:51px;font-size:26px}
  .story-head h1{font-size:42px}
  .story-head-actions{width:100%;margin-left:0}
  .story-head-actions .btn{flex:1}
  .now-actions{grid-template-columns:1fr}
  .add-step-row{flex-direction:column}
  .add-step-row .btn{width:100%}
}

/* Editorial explorer base: paper texture, offset shadows, poster accents */
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:radial-gradient(rgba(55,41,26,.25) .6px,transparent .7px);background-size:19px 21px;z-index:-1}
.brand-mark{border-radius:4px;transform:rotate(-3deg)}
.main-story:before{content:"01";position:absolute;right:22px;top:8px;font:700 76px/1 Georgia,"Times New Roman",serif;color:rgba(255,255,255,.22);pointer-events:none}
.story-card:hover{transform:translateY(-4px)}
.story-card:after{content:"";position:absolute;right:14px;bottom:13px;width:18px;height:18px;border-right:1px solid #c9bba7;border-bottom:1px solid #c9bba7}
.step-trigger{box-shadow:2px 2px 0 rgba(70,52,34,.07)}
.journey{position:relative;overflow:hidden}
.count-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.storage-status{font-size:10px;color:var(--muted);margin:9px 10px 0;line-height:1.4}
@media(max-width:900px){main{padding-left:13px;padding-right:13px;min-width:0}.story-cols{grid-template-columns:minmax(0,1fr)}.section-title{flex-wrap:wrap;min-width:0}.section-title>*{min-width:0;max-width:100%}.section-title .btn{max-width:100%;white-space:nowrap}.story-head{min-width:0}.story-head>*{min-width:0}.story-head-actions{min-width:0}.add-step-row{min-width:0;max-width:100%;flex-wrap:wrap}.add-step-row input{min-width:0;flex:1 1 180px}.story-card{transform:none}}

/* Bold editorial / travel-poster styling. Image-free, blank-template safe. */
body{
  background:
    radial-gradient(circle at 12% 16%,rgba(255,255,255,.55),transparent 28%),
    radial-gradient(circle at 88% 30%,rgba(242,207,53,.13),transparent 20%),
    var(--paper);
}
.topbar{border-bottom:2px solid var(--ink)}
.btn{border:1.5px solid var(--ink);border-radius:3px}
.btn.primary{background:var(--signal-red);border-color:var(--ink)}
.btn.primary:hover{background:#ad241b}
.section-rule:before{content:"";width:11px;height:11px;background:var(--poster-blue);transform:rotate(45deg);flex:0 0 auto}
.section-rule:after{height:2px;background:var(--ink)}
.home-hero{position:relative}
.home-hero:before{content:"VOL. 01 / THE LIFE EDITION";position:absolute;left:0;top:-18px;font-size:8px;letter-spacing:.22em;font-weight:900;color:var(--muted)}
.home-hero h1{text-transform:uppercase;line-height:.87}
.north-star{background:var(--signal-red);border:2px solid var(--ink);box-shadow:7px 8px 0 rgba(30,27,23,.2)}
.north-star:after{border-color:rgba(255,255,255,.55)}
.north-star .eyebrow,.north-star-edit{color:#fff5e7}
.main-story{
  background:var(--signal-red);color:#fff;border:2px solid var(--ink);
  box-shadow:8px 9px 0 rgba(30,27,23,.18)
}
.main-story:after{content:"";position:absolute;right:-40px;bottom:-65px;width:210px;height:210px;background:var(--poster-yellow);transform:rotate(18deg);opacity:.96}
.main-story-left{background:transparent;border-right:2px solid rgba(30,27,23,.35);position:relative;z-index:1}
.main-story-right{position:relative;z-index:1}
.main-story:before{font-size:96px;color:rgba(255,255,255,.22)}
.main-story h2{color:#fff;text-transform:uppercase;font-size:62px}
.main-story .story-subline,.main-story .goal-label,.main-story .goal-target,.main-story .mini-label{color:#fff3e7}
.story-badge{background:var(--poster-yellow);border:2px solid var(--ink);color:var(--ink)}
.goal-feature,.step-teaser{border-color:rgba(255,255,255,.5)}
.step-line{border-color:rgba(255,255,255,.35)}
.open-story{color:#fff;border-bottom:2px solid var(--poster-yellow);padding-bottom:4px}
.story-card{border:2px solid var(--ink);border-top-width:8px;box-shadow:6px 7px 0 rgba(30,27,23,.14)}
.story-card:nth-child(1){border-top-color:var(--poster-blue);background:#e9eef9}
.story-card:nth-child(2){border-top-color:var(--poster-cyan);background:#e7f2ef}
.story-card:nth-child(3){border-top-color:var(--poster-yellow);background:#fbf4ce}
.story-card:nth-child(4){border-top-color:var(--poster-orange);background:#fae6d8}
.story-card:nth-child(5){border-top-color:var(--signal-red);background:#f7ddd7}
.story-card h3{text-transform:uppercase;font-size:35px}
.story-head{border-bottom:2px solid var(--ink);padding-bottom:13px}
.story-head h1{text-transform:uppercase}
.story-head-icon{border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(30,27,23,.13)}
.goal-hero-panel{background:var(--poster-yellow);border:2px solid var(--ink);border-top:8px solid var(--signal-red)}
.panel{border:2px solid var(--ink);border-top-width:7px;box-shadow:6px 7px 0 rgba(30,27,23,.1)}
.section-title h2{text-transform:uppercase}
.step{border-color:#c9bda9}
.step-trigger{border:2px solid var(--ink);border-radius:2px;background:var(--signal-red);color:#fff}
.step-trigger:hover{background:var(--poster-yellow);color:var(--ink)}
.add-step-row{border-top:1px solid #c9bda9;padding-top:12px}
.add-step-row input{border:2px solid var(--ink);border-radius:2px}
.journey{background:#f8f0df;border-top-color:var(--poster-blue)}
.journey-track:before{width:2px;background:var(--ink)}

<body>
<div class="app">
  <header class="topbar">

    <div class="top-actions">
      <button class="btn" id="homeLogBtn">＋ Log</button>

      <button class="btn text" id="sideImportBtn" style="width:100%;margin-top:2px">⇧ Restore from file</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      <div id="storageStatus" class="storage-status"></div>
    </aside>
    <main id="main"></main>

</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="step-stamp" id="stepStamp"><strong>STEP TAKEN</strong></div>

<script>
const SCHEMA_VERSION = 1;
const DEFAULT_STATE = {
  schemaVersion: SCHEMA_VERSION,
  northStar:"",
  mainStoryId:null,
  quests:[],
  subs:[],
  goals:[],
  tasks:[],
  activities:[]
};

/* ---------------------------------------------------------------
   Storage layer. IndexedDB is the source of truth. The whole state
   is one document; see README (single-document decision).
   --------------------------------------------------------------- */
const DB_NAME="story-db", DB_VERSION=1, STORE="state", BACKUPS="backups", STATE_KEY="current";
const LEGACY_KEY="storyPrototypeV4";
let db=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);
      if(!d.objectStoreNames.contains(BACKUPS))d.createObjectStore(BACKUPS,{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbGet(store,key){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(store,"readonly").objectStore(store).get(key);
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function idbPut(store,value,key){
  return new Promise((resolve,reject)=>{
    const os=db.transaction(store,"readwrite").objectStore(store);
    const r=key!==undefined?os.put(value,key):os.put(value);
    r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}
function idbAll(store){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(store,"readonly").objectStore(store).getAll();
    r.onsuccess=()=>resolve(r.result||[]); r.onerror=()=>reject(r.error);
  });
}
function idbDelete(store,key){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(store,"readwrite").objectStore(store).delete(key);
    r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}

/* Keep the last 3 pre-change snapshots as a seatbelt. */
async function writeBackup(snapshot,reason){
  try{
    await idbPut(BACKUPS,{id:"b-"+Date.now(),reason,at:new Date().toISOString(),state:snapshot});
    const all=(await idbAll(BACKUPS)).sort((a,b)=>b.id.localeCompare(a.id));
    for(const old of all.slice(3))await idbDelete(BACKUPS,old.id);
  }catch(e){console.warn("backup failed",e)}
}

/* Ordered migrations. v1 is the current baseline (post points removal). */
const MIGRATIONS={
  1:(s)=>{
    // Legacy states carried per-item points and goal progress. Both are gone.
    (s.activities||[]).forEach(a=>{delete a.points});
    (s.tasks||[]).forEach(t=>{delete t.points});
    (s.goals||[]).forEach(g=>{delete g.progress});
    return s;
  }
};
async function migrate(s){
  const from=Number(s.schemaVersion||0);
  if(from>=SCHEMA_VERSION)return s;
  await writeBackup(JSON.parse(JSON.stringify(s)),`pre-migration v${from}`);
  for(let v=from+1;v<=SCHEMA_VERSION;v++){
    if(MIGRATIONS[v])s=MIGRATIONS[v](s);
  }
  s.schemaVersion=SCHEMA_VERSION;
  return s;
}

/* Ask the browser not to evict us. Without this, IndexedDB is just as
   clearable as localStorage was. */
let persistGranted=null;
async function requestPersistence(){
  try{
    if(navigator.storage?.persisted){
      persistGranted=await navigator.storage.persisted();
      if(!persistGranted && navigator.storage.persist)persistGranted=await navigator.storage.persist();
    }
  }catch(e){persistGranted=null}
}

let state=JSON.parse(JSON.stringify(DEFAULT_STATE));
let currentStory = null;

async function loadState(){
  db=await openDB();
  let migratedFromLegacy=false;
  let loaded=await idbGet(STORE,STATE_KEY);
  if(!loaded){
    // One-time migration from the old localStorage home.
    let legacy=null;
    try{legacy=localStorage.getItem(LEGACY_KEY)}catch(e){}
    if(legacy){
      // Only a genuine parse failure may discard this data. Nothing else in
      // this block is allowed to cost the user their history.
      try{loaded=JSON.parse(legacy)}catch(e){loaded=null;console.error("legacy parse failed",e)}
      if(loaded)migratedFromLegacy=true;
    }
  }
  if(loaded){
    state=await migrate(loaded);
    await idbPut(STORE,state,STATE_KEY);
  }else{
    state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  return {migratedFromLegacy};
}

const attRank={max:0,active:1,available:2,background:3};

/* Debounced write so rapid edits don't thrash the DB. */
let saveTimer=null, saveFailed=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await idbPut(STORE,state,STATE_KEY);
      saveFailed=false;
    }catch(e){
      if(!saveFailed){saveFailed=true;toast("Could not save. Export your data.")}
      console.error("save failed",e);
    }
  },300);
}
function q(id){return state.quests.find(x=>x.id===id)}
function goals(id){return state.goals.filter(x=>x.questId===id&&x.status!=="complete")}
function subs(id){return state.subs.filter(x=>x.questId===id&&x.status!=="dormant")}
function tasks(id){return state.tasks.filter(x=>x.questId===id)}
function openTasks(id){return tasks(id).filter(x=>x.status==="open")}
function acts(id){return state.activities.filter(x=>x.questId===id).sort((a,b)=>b.date.localeCompare(a.date))}
function latest(id){return acts(id)[0]?.date||""}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}
function humanDate(d){
  const today=new Date(); today.setHours(12,0,0,0);
  const date=new Date(d+"T12:00:00");
  const diff=Math.round((today-date)/86400000);
  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  if(diff<7)return diff+" days ago";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function renderNav(){
  const nav=document.getElementById("storyNav");
  const list=[...state.quests].filter(x=>x.status==="active").sort((a,b)=>attRank[a.attention]-attRank[b.attention]||(latest(b.id)||"").localeCompare(latest(a.id)||""));
  nav.innerHTML=list.map(x=>`<button class="${currentStory===x.id?"active":""}" data-nav="${x.id}">
    <span class="nav-icon">${x.icon}</span><span class="nav-name">${esc(x.name)}</span>${state.mainStoryId===x.id?`<span class="nav-main">★</span>`:""}
  </button>`).join("");
  nav.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>openStory(b.dataset.nav));
}
function featuredGoal(id){return goals(id)[0]||state.goals.find(x=>x.questId===id)||null}
function renderHome(){
  currentStory=null;renderNav();
  const list=[...state.quests].filter(x=>x.status==="active").sort((a,b)=>attRank[a.attention]-attRank[b.attention]||(latest(b.id)||"").localeCompare(latest(a.id)||""));

  if(list.length===0){
    document.getElementById("main").innerHTML=`
      <section class="home-hero">
        <div>
          <div class="eyebrow">Your story</div>
          <h1 class="serif-title">Start with one part of your life.</h1>
          <p class="hero-note">Career, Writing, Health, whatever matters to you. You can add more whenever something new comes into focus.</p>
        </div>
        <div class="north-star">
          <div class="eyebrow">North Star</div>
          <div class="north-star-text">${state.northStar?esc(state.northStar):"Optional, one sentence that guides the whole story."}</div>
          <button class="north-star-edit north-star-edit-btn" id="editNorthStar">${state.northStar?"Edit North Star":"Set a North Star"}</button>
        </div>
      </section>
      <div class="section-rule"><span>Begin</span></div>
      <section class="step-empty" style="padding:38px 20px">
        <div class="empty-title">The page is blank.</div>
        <p>Create your first Story to start finding your way. There's nothing else to set up first.</p>
        <button class="btn primary" id="firstStoryBtn">＋ Create your first Story</button>
      </section>`;
    document.getElementById("editNorthStar").onclick=openNorthStar;
    document.getElementById("firstStoryBtn").onclick=openAddStory;
    renderStorageStatus();
    return;
  }

  const main=q(state.mainStoryId)||list[0];
  const mainGoal=main?featuredGoal(main.id):null;
  const mainOpen=main?openTasks(main.id).slice(0,2):[];
  const others=list.filter(x=>x.id!==main?.id);
  document.getElementById("main").innerHTML=`
    <section class="home-hero">
      <div>
        <div class="eyebrow">Your story</div>
        <h1 class="serif-title">What story are you writing?</h1>
        <p class="hero-note">Choose where to go next. Keep the direction visible. Let the steps add up to a life that feels like yours.</p>
      </div>
      <div class="north-star">
        <div class="eyebrow">North Star</div>
        <div class="north-star-text">${esc(state.northStar)}</div>
        <button class="north-star-edit north-star-edit-btn" id="editNorthStar">Edit North Star</button>
      </div>
    </section>

    ${main?`
    <div class="section-rule"><span>★ Main Story</span></div>
    <section class="main-story">
      <div class="main-story-left">
        <div class="story-badge"><span class="star">★</span> Main Story</div>
        <h2>${esc(main.name)}</h2>
        <div class="story-subline">${mainGoal?esc(mainGoal.title):"A story waiting for its next chapter."}</div>
        ${mainGoal?`<div class="goal-feature">
          <div class="goal-label">Goal</div>
          <h3>${esc(mainGoal.title)}</h3>
          <div class="goal-target">${esc(mainGoal.target||"")}</div>
        </div>`:""}
      </div>
      <div class="main-story-right">
        <div>
          <div class="mini-label">Next steps</div>
          <div class="step-teaser">
            ${mainOpen.length?mainOpen.map(t=>`<div class="step-line"><span class="step-title">${esc(t.title)}</span></div>`).join(""):`<div class="step-line"><span class="step-title">No steps queued</span></div>`}
          </div>
        </div>
        <button class="open-story" data-open-main="${main.id}">Open story →</button>
      </div>
    </section>`:""}

    <div class="section-rule"><span>Stories</span></div>
    <section class="story-grid">
      ${others.map(x=>{
        const g=featuredGoal(x.id); const a=latest(x.id);
        return `<button class="story-card" data-card="${x.id}">
          <div><div class="card-icon">${x.icon}</div><h3>${esc(x.name)}</h3>
            <div class="card-goal-label">Goal</div>
            <div class="card-goal">${g?esc(g.title):"Choose a direction"}</div>
          </div>
          <div class="card-footer"><div class="card-journey">${a?`Journey · ${humanDate(a)}`:"No journey yet"}</div><div class="card-open">Open →</div></div>
        </button>`
      }).join("")}
    </section>`;
  document.getElementById("editNorthStar").onclick=openNorthStar;
  document.querySelectorAll("[data-card]").forEach(el=>el.onclick=()=>openStory(el.dataset.card));
  document.querySelectorAll("[data-open-main]").forEach(el=>el.onclick=()=>openStory(el.dataset.openMain));
}
function openStory(id){
  currentStory=id;renderNav();
  const story=q(id); if(!story)return renderHome();
  const gs=goals(id), ss=subs(id), os=openTasks(id), history=acts(id);
  const highlighted=gs[0]||null;
  document.getElementById("main").innerHTML=`
    <div class="story-head">
      <button class="btn text back" id="backHome">←</button>
      <div class="story-head-icon">${story.icon}</div>
      <div><div class="eyebrow">${state.mainStoryId===id?"★ Main Story":"Story"}</div><h1>${esc(story.name)}</h1><div class="story-head-meta">${history.length} steps taken · ${history.length} journey entr${history.length===1?"y":"ies"}</div></div>
      <div class="story-head-actions"><button class="btn" id="logStoryBtn">＋ Log</button><button class="btn" id="editStoryBtn">Edit</button></div>
    </div>

    ${highlighted?`<section class="panel goal-hero-panel">
      <div class="goal-row">
        <div><div class="eyebrow">Goal</div><h2>${esc(highlighted.title)}</h2><div class="goal-target">${esc(highlighted.target||"")}</div></div>
      </div>
    </section>`:""}

    <div class="story-cols">
      <section class="panel">
        <div class="section-title">
          <div><div class="kicker">The next chapter starts here</div><h2>Take a Step</h2></div>
          <div class="count-label">${os.length} available</div>
        </div>
        <div class="step-list">
          ${os.length?os.map(t=>`<div class="step">
            <button class="step-trigger" data-complete="${t.id}" title="Complete step">→</button>
            <div class="step-copy"><h4>${esc(t.title)}</h4><div class="step-meta">${stepContext(t)}</div></div>
          </div>`).join(""):`
            <div class="step-empty">
              <div class="empty-title">The road is clear.</div>
              <p>Your story isn't empty. Add a new step when you see one worth taking.</p>
              <button class="btn" id="emptyAddStep">＋ Add a step</button>
            </div>`}
        </div>
        <div class="add-step-row">
          <input id="quickStepInput" placeholder="What is one small step you could take?">
          <button class="btn primary" id="quickStepAdd">Add</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <div><div class="kicker">Direction</div><h2>Chapters</h2></div>
          <button class="btn" id="addSubBtn">＋ Chapter</button>
        </div>
        <div class="chapter-list">
          ${ss.length?ss.map(s=>`<div class="list-item"><div class="list-title">${esc(s.title)}</div><div class="list-meta">Chapter · ${esc(s.status)}</div></div>`).join(""):`<div class="step-empty"><div class="empty-title">No chapters yet.</div><p>Use chapters for the threads inside this Story.</p></div>`}
        </div>
        <div class="section-title" style="margin-top:25px">
          <div><div class="kicker">Direction</div><h2>Goals</h2></div>
          <button class="btn" id="addGoalBtn">＋ Goal</button>
        </div>
        <div class="goal-list">
          ${gs.length?gs.map(g=>`<div class="list-item"><div class="list-title">${esc(g.title)}</div><div class="list-meta">${esc(g.target||"")}</div></div>`).join(""):`<div class="step-empty"><div class="empty-title">No goals yet.</div><p>A goal gives the Story somewhere meaningful to go.</p></div>`}
        </div>
      </section>
    </div>

    <section class="panel journey">
      <div class="section-title"><div><div class="kicker">The story so far</div><h2>Journey</h2></div><div class="count-label">${history.length} steps taken</div></div>
      <div class="journey-track">
        ${history.length?history.map(a=>`<div class="journal-entry">
          <div class="journal-date">${humanDate(a.date)}</div>
          <div class="journal-note">${esc(a.note)}</div>
          <div class="journal-meta">${a.taskId?"Step completed":"Activity logged"}</div>
        </div>`).join(""):`<div class="step-empty"><div class="empty-title">Your Journey begins with a step.</div><p>Complete a step or log something you did.</p></div>`}
      </div>
    </section>`;

  document.getElementById("backHome").onclick=renderHome;
  document.getElementById("logStoryBtn").onclick=()=>openLog(id);
  document.getElementById("editStoryBtn").onclick=()=>openStoryModal(id);
  document.getElementById("addGoalBtn").onclick=()=>openGoal(id);
  document.getElementById("addSubBtn").onclick=()=>openChapter(id);
  document.getElementById("quickStepAdd").onclick=()=>addQuickStep(id);
  document.getElementById("quickStepInput").addEventListener("keydown",e=>{if(e.key==="Enter")addQuickStep(id)});
  const empty=document.getElementById("emptyAddStep"); if(empty)empty.onclick=()=>document.getElementById("quickStepInput").focus();
  document.querySelectorAll("[data-complete]").forEach(b=>b.onclick=()=>completeStep(b.dataset.complete));
}
function stepContext(t){
  const c=state.subs.find(s=>s.id===t.subQuestId)?.title;
  const g=state.goals.find(s=>s.id===t.goalId)?.title;
  return [c,g].filter(Boolean).map(esc).join(" · ")||"A step in this Story";
}
function showStamp(){
  const stamp=document.getElementById("stepStamp");
  stamp.classList.add("show"); setTimeout(()=>stamp.classList.remove("show"),1700);
}
function completeStep(id){
  const t=state.tasks.find(x=>x.id===id);if(!t||t.status==="complete")return;
  t.status="complete";t.completedAt=new Date().toISOString().slice(0,10);
  state.activities.push({id:"a-"+Date.now(),questId:t.questId,taskId:t.id,note:t.title,date:t.completedAt});
  save(); showStamp(); openStory(t.questId);
}
function addQuickStep(id){
  const input=document.getElementById("quickStepInput");
  const title=input.value.trim();if(!title){toast("Add a step first");return}
  state.tasks.push({id:"t-"+Date.now(),questId:id,subQuestId:null,goalId:goals(id)[0]?.id||null,title,status:"open",createdAt:new Date().toISOString()});
  save();toast("Step added");openStory(id);
}
function showModal(title,body){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.add("open");
  const c=document.getElementById("cancelModal");if(c)c.onclick=closeModal;
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modalClose").onclick=closeModal;
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function openNorthStar(){
  showModal("North Star",`
    <div class="field"><label>One sentence that guides the whole story</label>
      <textarea id="northStarInput">${esc(state.northStar)}</textarea>
    </div>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveNorthStar">Save</button></div>`);
  document.getElementById("saveNorthStar").onclick=()=>{
    const v=document.getElementById("northStarInput").value.trim();if(!v){toast("Give your North Star a sentence");return}
    state.northStar=v;save();closeModal();renderHome();toast("North Star updated");
  };
}
function openGoal(id){
  showModal("Add Goal",`
    <div class="field"><label>Goal</label><input id="goalTitle" placeholder="What do you want this Story to become?"></div>
    <div class="field"><label>Target</label><input id="goalTarget" placeholder="Optional, e.g. one finished piece"></div>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveGoal">Add goal</button></div>`);
  document.getElementById("saveGoal").onclick=()=>{
    const title=document.getElementById("goalTitle").value.trim();if(!title){toast("Add a goal title");return}
    state.goals.push({id:"g-"+Date.now(),questId:id,title,target:document.getElementById("goalTarget").value.trim(),status:"open",createdAt:new Date().toISOString()});
    save();closeModal();openStory(id);toast("Goal added");
  };
}
function openChapter(id){
  showModal("Add Chapter",`
    <div class="field"><label>Chapter</label><input id="chapterTitle" placeholder="A meaningful thread within this Story"></div>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveChapter">Add chapter</button></div>`);
  document.getElementById("saveChapter").onclick=()=>{
    const title=document.getElementById("chapterTitle").value.trim();if(!title){toast("Add a chapter title");return}
    state.subs.push({id:"s-"+Date.now(),questId:id,title,status:"active",createdAt:new Date().toISOString()});
    save();closeModal();openStory(id);toast("Chapter added");
  };
}
function openLog(defaultId){
  if(!state.quests.some(x=>x.status==="active")){toast("Create a Story first");openAddStory();return}
  showModal("Log a Journey Entry",`
    <div class="field"><label>Story</label><select id="logStory">${state.quests.filter(x=>x.status==="active").map(x=>`<option value="${x.id}" ${x.id===defaultId?"selected":""}>${x.icon} ${esc(x.name)}</option>`).join("")}</select></div>
    <div class="field"><label>What happened?</label><textarea id="logNote" placeholder="Write a small field note…"></textarea></div>
    <div class="field"><label>Date</label><input id="logDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveLog">Add to Journey</button></div>`);
  document.getElementById("saveLog").onclick=()=>{
    const note=document.getElementById("logNote").value.trim();if(!note){toast("Add a field note first");return}
    const sid=document.getElementById("logStory").value;
    state.activities.push({id:"a-"+Date.now(),questId:sid,taskId:null,note,date:document.getElementById("logDate").value});
    save();closeModal();toast("Journey updated");
    if(currentStory===sid)openStory(sid);else renderHome();
  };
}
function openStoryModal(editId){
  const story=q(editId);
  showModal("Edit Story",`
    <div class="field"><label>Name</label><input id="storyName" value="${esc(story.name)}"></div>
    <div class="field"><label>Icon</label><input id="storyIcon" maxlength="2" value="${esc(story.icon)}"></div>
    <div class="field"><label>Attention</label><select id="storyAttention">${["max","active","available","background"].map(v=>`<option value="${v}" ${story.attention===v?"selected":""}>${v.replace("_"," ")}</option>`).join("")}</select></div>
    <div class="field"><label>Story type</label><select id="mainStoryChoice"><option value="no">Other story</option><option value="yes" ${state.mainStoryId===story.id?"selected":""}>Main Story</option></select></div>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveStory">Save</button></div>`);
  document.getElementById("saveStory").onclick=()=>{
    story.name=document.getElementById("storyName").value.trim()||story.name;
    story.icon=document.getElementById("storyIcon").value||"✦";
    story.attention=document.getElementById("storyAttention").value;
    if(document.getElementById("mainStoryChoice").value==="yes")state.mainStoryId=story.id;
    else if(state.mainStoryId===story.id){
      const fallback=state.quests.find(x=>x.status==="active"&&x.id!==story.id);state.mainStoryId=fallback?.id||story.id;
    }
    save();closeModal();openStory(editId);toast("Story updated");
  };
}
function openAddStory(){
  showModal("Add Story",`
    <div class="field"><label>Story name</label><input id="newStoryName" placeholder="e.g. Photography"></div>
    <div class="field"><label>Icon</label><input id="newStoryIcon" maxlength="2" value="✦"></div>
    <div class="field"><label>Attention</label><select id="newStoryAttention">${["max","active","available","background"].map(v=>`<option value="${v}">${v.replace("_"," ")}</option>`).join("")}</select></div>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="saveNewStory">Create story</button></div>`);
  document.getElementById("saveNewStory").onclick=()=>{
    const name=document.getElementById("newStoryName").value.trim();if(!name){toast("Name your Story");return}
    const id="q-"+Date.now();
    state.quests.push({id,name,icon:document.getElementById("newStoryIcon").value||"✦",attention:document.getElementById("newStoryAttention").value,status:"active",createdAt:new Date().toISOString()});
    if(!state.mainStoryId)state.mainStoryId=id;
    save();closeModal();openStory(id);toast("Story created");
  };
}
function validateImport(obj){
  if(!obj||typeof obj!=="object")return "That file isn't a Story export.";
  for(const k of ["quests","subs","goals","tasks","activities"]){
    if(!Array.isArray(obj[k]))return `That file is missing its ${k} list.`;
  }
  return null;
}
async function importData(file){
  let parsed;
  try{parsed=JSON.parse(await file.text())}
  catch(e){toast("Couldn't read that file");return}
  const problem=validateImport(parsed);
  if(problem){toast(problem);return}
  const counts=`${parsed.quests.length} ${parsed.quests.length===1?"Story":"Stories"}, ${parsed.activities.length} Journey ${parsed.activities.length===1?"entry":"entries"}`;
  const when=parsed.exportedAt?new Date(parsed.exportedAt).toLocaleDateString():"an unknown date";
  showModal("Restore from file",`
    <p style="margin:0 0 6px;font-size:14px">This will <strong>replace</strong> everything currently in Story with the contents of this file.</p>
    <p style="margin:0 0 14px;font-size:14px;color:var(--muted)">Restoring ${counts}, exported ${esc(when)}. Your current data is backed up first, in case you need it.</p>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="confirmRestore">Replace my data</button></div>`);
  document.getElementById("confirmRestore").onclick=async()=>{
    await writeBackup(JSON.parse(JSON.stringify(state)),"pre-restore");
    state=await migrate(parsed);
    await idbPut(STORE,state,STATE_KEY);
    closeModal();renderHome();toast("Story restored");
  };
}
async function exportData(){
  state.exportedAt=new Date().toISOString();
  const payload=JSON.stringify(state,null,2);
  const filename=`story-export-${new Date().toISOString().slice(0,10)}.json`;
  try{
    const file=new File([payload],filename,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Story backup",text:"Your Story app data export"});
      return;
    }
  }catch(e){ if(e && e.name==="AbortError")return; /* otherwise fall through to download */ }
  const url=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
  const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1000);
  toast("Exported, check your Downloads");
}
document.getElementById("homeLogBtn").onclick=()=>openLog(currentStory);
document.getElementById("homeAddStoryBtn").onclick=openAddStory;
document.getElementById("sideAddStory").onclick=openAddStory;
document.getElementById("sideExportBtn").onclick=exportData;
document.getElementById("sideImportBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(f)importData(f); e.target.value="";
});

function renderStorageStatus(){
  const el=document.getElementById("storageStatus"); if(!el)return;
  const bits=[];
  if(state.exportedAt){
    const days=Math.floor((Date.now()-new Date(state.exportedAt))/86400000);
    bits.push(days===0?"Exported today":days===1?"Exported yesterday":`Exported ${days} days ago`);
    if(days>=14)bits.push("Worth exporting again");
  }else{
    bits.push("Never exported");
  }
  if(persistGranted===false)bits.push("Storage not protected by this browser");
  el.textContent=bits.join(" · ");
}

(async function boot(){
  let result={};
  try{
    result=await loadState();
  }catch(e){
    console.error("load failed",e);
    toast("Could not open local storage");
  }
  await requestPersistence();
  renderHome();
  renderStorageStatus();
  if(result.migratedFromLegacy)toast("Your data has been moved to safer storage");
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
