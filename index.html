<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story, a life in chapters</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1b17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== SECTION: tokens ===== */
:root{
  --paper:#ede5d6;
  --paper2:#fbf7ed;
  --ink:#201c17;
  --muted:#72695d;
  --rule:#cfc3b1;
  --olive:#52614a;
  --olive-soft:#e1e7dd;
  --terracotta:#ad5941;
  --terracotta-soft:#eeded6;
  --gold:#ae873f;
  --gold-soft:#efe2c9;
  --blue:#6d7e83;
  --blue-soft:#e3e8e9;
  /* Reserved for destructive actions only. If red appears on a routine
     control it stops meaning anything. */
  --signal-red:#cf2d22;
  --shadow:0 16px 42px rgba(47,35,22,.12);
  --serif:Georgia,"Times New Roman",serif;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.35), transparent 32%),
    radial-gradient(circle at 80% 60%, rgba(173,145,95,.08), transparent 34%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
a{text-decoration:none;color:inherit}

.app{min-height:100vh;overflow-x:hidden;max-width:100vw}
.topbar{
  height:70px;
  border-bottom:1px solid var(--rule);
  background:rgba(246,241,232,.92);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(12px);
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-family:var(--serif);
  font-size:21px;
  font-weight:700;
  letter-spacing:-.03em;
}
.brand-mark{
  width:31px;height:31px;border:1.5px solid var(--ink);
  border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-family:var(--sans);font-weight:900;
}
.btn{
  border:1px solid var(--rule);
  background:var(--paper2);
  color:var(--ink);
  border-radius:10px;
  padding:9px 13px;
  font-weight:760;
}
.btn:hover{background:#f5efe4}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.text{background:transparent;border-color:transparent;color:var(--muted)}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 70px);min-width:0}
aside{
  border-right:1px solid var(--rule);
  padding:24px 16px;
  background:rgba(246,241,232,.52);
}
.aside-kicker{
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.19em;
  color:var(--muted);
  margin:4px 10px 13px;
}
.story-nav{display:flex;flex-direction:column;gap:3px}
.story-nav button{
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  border-radius:9px;
  padding:10px;
  display:flex;align-items:center;gap:9px;
  color:var(--ink);
}
.story-nav button:hover{background:rgba(255,255,255,.36)}
.story-nav button.active{background:var(--ink);color:#fff}
.nav-icon{width:25px;flex:0 0 25px}
.nav-name{font-weight:720;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-main{font-size:10px;color:var(--gold);font-weight:900}
.story-nav button.active .nav-main{color:#efcf8d}
main{max-width:1180px;width:100%;margin:0 auto;padding:34px 36px 70px}
.eyebrow{
  font-size:10px;text-transform:uppercase;letter-spacing:.2em;
  font-weight:900;color:var(--muted);
}
.serif-title{font-family:var(--serif);letter-spacing:-.045em}
.home-hero{
  margin-bottom:28px;
}
.home-hero h1{font-size:clamp(28px,4.4vw,40px);line-height:1.02;margin:6px 0 0;max-width:760px}
.hero-note{font-family:var(--serif);font-size:15px;color:var(--muted);margin:9px 0 0;max-width:670px;line-height:1.4}
.section-rule{display:flex;align-items:center;gap:12px;margin:34px 0 15px}
.section-rule .btn{flex:0 0 auto;order:1;font-size:12px;padding:7px 11px}
.section-rule span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:900;white-space:nowrap}
.section-rule:after{content:"";height:2px;background:var(--ink);flex:1}
.main-story{
  display:grid;grid-template-columns:1.08fr .92fr;gap:0;
  background:var(--olive);color:#fff;border:2px solid var(--ink);box-shadow:8px 9px 0 rgba(30,27,23,.18);
  min-height:275px;
  position:relative;overflow:hidden;
}
.main-story-left{padding:26px 26px 24px;background:linear-gradient(135deg,#f7f1e5,#eee5d5);border-right:1px solid var(--rule)}
.main-story-right{padding:26px;display:flex;flex-direction:column;justify-content:space-between}
.story-badge{
  display:inline-flex;align-items:center;gap:7px;border:1px solid #cfc3ad;
  padding:5px 8px;border-radius:2px;font-size:10px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;
  background:#f8f1e3;
}
.story-badge .star{color:var(--gold)}
.main-story h2{font-family:var(--serif);font-size:52px;line-height:.98;margin:16px 0 8px;letter-spacing:-.05em}
.story-subline{color:var(--muted);font-size:13px;max-width:500px}
.goal-feature{margin-top:22px;border-top:1px solid rgba(120,107,88,.25);padding-top:14px}
.goal-label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;color:var(--muted)}
.goal-feature h3{font-family:var(--serif);font-size:25px;line-height:1.05;margin:7px 0 0;letter-spacing:-.035em}
.goal-target{font-size:12px;color:var(--muted);margin-top:5px}
.main-story-right .mini-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.step-teaser{
  border-top:1px solid var(--rule);
  padding-top:13px;margin-top:10px;
}
.step-line{
  display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ece5d9;
}
.step-line:last-child{border-bottom:0}
.step-title{font-weight:760;font-size:13px}
.open-story{
  align-self:flex-start;border:0;background:transparent;padding:0;color:var(--ink);
  font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;
}
.open-story:hover{text-decoration:underline;text-underline-offset:4px}

.story-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.story-card{
  background:rgba(255,253,248,.82);border-top:4px solid var(--olive);
  padding:17px 17px 15px;min-height:190px;border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);
  position:relative;transition:.18s;display:flex;flex-direction:column;
}
.story-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.story-card .card-icon{font-size:25px}
.story-card h3{font-family:var(--serif);font-size:29px;line-height:1;margin:13px 0 5px;letter-spacing:-.04em}
.story-card .card-goal-label{font-size:9px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:900}
.story-card .card-goal{font-family:var(--serif);font-size:18px;line-height:1.12;margin-top:4px}
.card-footer{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-top:auto;padding-top:18px}
.card-journey{font-size:11px;color:var(--muted)}
.card-open{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}

.story-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.back{display:none}
.story-head-icon{width:58px;height:58px;display:grid;place-items:center;font-size:30px;background:#e4dccd;border:1px solid #cfc5b5}
.story-head h1{font-family:var(--serif);font-size:clamp(30px,6vw,42px);line-height:1;letter-spacing:-.03em;margin:0 0 4px}
.story-head-meta{font-size:12px;color:var(--muted)}
.story-head-actions{margin-left:auto;display:flex;gap:4px;flex:0 0 auto;align-items:center}
.panel{
  background:rgba(255,253,248,.86);
  border:1px solid var(--rule);
  padding:22px;
  box-shadow:0 5px 14px rgba(44,37,26,.025);
}
.story-cols{display:grid;grid-template-columns:1.08fr .92fr;gap:15px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}
.section-title h2{font-family:var(--serif);font-size:27px;letter-spacing:-.035em;margin:3px 0 0}
.step-list{display:flex;flex-direction:column}
.step{
  display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;
  border-top:1px solid #e7dfd3;padding:13px 0;
}
.step:first-child{border-top:0;padding-top:0}
.step-trigger{
  width:29px;height:29px;border-radius:2px;border:2px solid var(--ink);background:var(--paper2);
  display:grid;place-items:center;color:var(--ink);font-weight:900;
}
.step-trigger:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.step-copy{min-width:0}
.step h4{margin:0;font-size:14px}
.step-meta{font-size:11px;color:var(--muted);margin-top:3px}
.step-anchor{font-size:11px;color:var(--ink);opacity:.72;margin-top:3px;font-style:italic}
.view-toggle{display:flex;gap:8px;margin:0 0 18px}
.view-tab{font-family:var(--sans);font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;padding:8px 14px;border:2px solid var(--ink);border-radius:2px;background:var(--paper2);color:var(--ink);cursor:pointer}
.view-tab.on{background:var(--ink);color:var(--paper2)}
.flat-steps{margin-bottom:22px}
.practice-tag{font-size:9px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:var(--blue);margin-left:7px}
.step.practice .step-trigger:hover{background:var(--olive-soft);color:var(--ink)}
.step.practice .step-trigger.marked{background:var(--olive);color:#fff}
.step-empty{
  border:1px dashed #cfc5b4;padding:20px 15px;text-align:center;background:#faf6ee;
}
.step-empty .empty-title{font-family:var(--serif);font-size:20px}
.step-empty.page-empty{padding:36px 20px}
.step-empty p{color:var(--muted);font-size:12px;margin:5px auto 12px;max-width:280px}
.add-step-row{display:flex;gap:7px;margin-top:12px}
.add-step-row input{
  flex:1;border:1px solid var(--rule);background:#fff;padding:10px 11px;border-radius:8px;
}
.btn.danger{color:var(--signal-red)}
.btn.primary.danger,.modal-footer .btn.danger:not(.text){background:var(--signal-red);color:#fff;border-color:var(--signal-red)}
.list-meta{font-size:11px;color:var(--muted);margin-top:3px}

/* Direction section: goals nested under their chapter. One block per
   chapter, plus a trailing block for goals that have no chapter. */
.chapter-block{border-top:1px solid #e7dfd3;padding:11px 0 3px}
.chapter-block:first-of-type{border-top:0;padding-top:2px}
.chapter-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chapter-name{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;color:var(--muted)}
.chapter-name-loose{opacity:.7}
.chapter-dormant{opacity:.6}
.chapter-empty{font-size:12px;color:var(--muted);padding:5px 0 8px}
.tag{font-size:9px;letter-spacing:.1em;border:1px solid var(--rule);border-radius:9px;padding:1px 6px;margin-left:7px}
.goal-row-item{display:flex;align-items:flex-start;gap:10px;padding:7px 0 8px}
.goal-row-copy{flex:1;min-width:0}
.goal-row-title{font-family:var(--serif);font-size:19px;line-height:1.1}
.goal-done .goal-row-title{opacity:.5}

/* Quiet icon button, so the row's content stays the loudest thing in it. */
.icon-btn{flex:0 0 auto;border:0;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:4px 5px;cursor:pointer;border-radius:6px}
.icon-btn:hover{background:rgba(30,27,23,.07);color:var(--ink)}
.title-actions{display:flex;gap:2px;flex:0 0 auto}
.head-action{font-size:12px;padding:5px 8px}
.story-head-copy{flex:1;min-width:0}
.journey{margin-top:15px}
.journey-track{position:relative;padding-left:24px}
.journey-track:before{content:"";position:absolute;left:6px;top:4px;bottom:5px;width:1px;background:#cfc4b4}
.journal-entry{position:relative;padding:0 0 19px}
.journal-check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.journal-check input{width:14px;height:14px;accent-color:var(--olive);cursor:pointer;margin:0}
.journal-entry:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--terracotta);box-shadow:0 0 0 3px var(--paper2)}
.journal-date{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:900}
.journal-note{font-family:var(--serif);font-size:20px;line-height:1.12;margin:4px 0}
.journal-meta{font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}

.modal-backdrop{position:fixed;inset:0;background:rgba(25,21,17,.52);display:none;align-items:center;justify-content:center;padding:17px;z-index:60}
.modal-backdrop.open{display:flex}
.modal{width:min(620px,100%);background:var(--paper2);border:1px solid var(--rule);box-shadow:0 28px 90px rgba(0,0,0,.27);padding:23px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.modal h2{font-family:var(--serif);font-size:30px;letter-spacing:-.04em;margin:0}
.close{border:1px solid var(--rule);background:#f1eadf;width:33px;height:33px;border-radius:50%;font-size:18px}
.field{margin:13px 0}
.field label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:900;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--rule);background:#fff;padding:11px;border-radius:8px;color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 15px;font-size:12px;font-weight:800;z-index:90;transition:.2s;border-radius:9px;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.step-stamp{
  position:fixed;left:50%;top:94px;transform:translate(-50%,-8px) rotate(-2deg) scale(.98);opacity:0;pointer-events:none;
  border:2px solid var(--terracotta);color:var(--terracotta);background:rgba(250,244,234,.94);
  padding:11px 15px 9px;text-align:center;z-index:85;transition:.2s;box-shadow:0 10px 26px rgba(60,42,27,.13)
}
.step-stamp.show{opacity:1;transform:translate(-50%,0) rotate(-2deg) scale(1)}
.step-stamp strong{display:block;font-family:var(--serif);font-size:20px;line-height:1}

@media(max-width:900px){
  .topbar{height:auto;min-height:64px;padding:10px 13px}
  .layout{grid-template-columns:1fr}
  aside{display:none}
  main{padding:23px 13px 55px}
  /* hero is single-column since the North Star was retired */
  .main-story{grid-template-columns:1fr}
  .main-story-left{border-right:0;border-bottom:1px solid var(--rule)}
  .story-grid{grid-template-columns:1fr}
  .story-cols{grid-template-columns:1fr}
  .back{display:inline-flex;order:-1}
  .story-head{align-items:center}
}
@media(max-width:560px){
  .brand{display:none}
  .main-story h2{font-size:45px}
  .main-story-left,.main-story-right{padding:21px}
  .panel{padding:18px}
  .story-head{gap:11px}
  .story-head-icon{width:51px;height:51px;font-size:26px}
}

/* ===== SECTION: styles-poster ===== */
/* Editorial explorer base: paper texture, offset shadows, poster accents */
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:radial-gradient(rgba(55,41,26,.25) .6px,transparent .7px);background-size:19px 21px;z-index:-1}
.brand-mark{border-radius:4px;transform:rotate(-3deg)}
.main-story:before{content:"01";position:absolute;right:22px;top:8px;font:700 76px/1 Georgia,"Times New Roman",serif;color:rgba(255,255,255,.22);pointer-events:none}
.story-card:hover{transform:translateY(-4px)}
.story-card:after{content:"";position:absolute;right:14px;bottom:13px;width:18px;height:18px;border-right:1px solid #c9bba7;border-bottom:1px solid #c9bba7}
.step-trigger{box-shadow:2px 2px 0 rgba(70,52,34,.07)}
.journey{position:relative;overflow:hidden}
.count-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.storage-status{font-size:10px;color:var(--muted);line-height:1.4}
.data-footer{border-top:2px solid var(--ink);background:rgba(246,241,232,.6);padding:14px 28px 22px}
.data-footer-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.data-actions{display:flex;gap:8px;flex-wrap:wrap}
.data-actions .btn{font-size:12px;padding:8px 11px}
@media(max-width:900px){main{padding-left:13px;padding-right:13px;min-width:0}.story-cols{grid-template-columns:minmax(0,1fr)}.section-title{flex-wrap:wrap;min-width:0}.section-title>*{min-width:0;max-width:100%}.section-title .btn{max-width:100%;white-space:nowrap}.story-head{min-width:0}.story-head>*{min-width:0}.story-head-actions{min-width:0}.add-step-row{min-width:0;max-width:100%;flex-wrap:wrap}/* basis must stay auto: the row becomes a column below 560px, where a fixed basis is read as HEIGHT and balloons the input */.add-step-row input{min-width:0;flex:1 1 auto}.story-card{transform:none}}

/* Bold editorial / travel-poster styling. Image-free, blank-template safe. */
body{
  background:
    radial-gradient(circle at 12% 16%,rgba(255,255,255,.55),transparent 28%),
    radial-gradient(circle at 88% 30%,rgba(242,207,53,.13),transparent 20%),
    var(--paper);
}
.topbar{border-bottom:2px solid var(--ink)}
.btn{border:1.5px solid var(--ink);border-radius:3px}
.btn.primary{background:var(--terracotta);border-color:var(--ink)}
.btn.primary:hover{background:#96482f}
.section-rule:before{content:"";width:11px;height:11px;background:var(--blue);transform:rotate(45deg);flex:0 0 auto}
.home-hero{position:relative}
.main-story-left{background:transparent;border-right:2px solid rgba(30,27,23,.35);position:relative;z-index:1}
.main-story-right{position:relative;z-index:1}
.main-story:before{font-size:96px;color:rgba(255,255,255,.22)}
.main-story h2{color:#fff;font-size:56px}
.main-story .story-subline,.main-story .goal-label,.main-story .goal-target,.main-story .mini-label{color:#fff3e7}
.story-badge{background:var(--gold-soft);border:2px solid var(--ink);color:var(--ink)}
.goal-feature,.step-teaser{border-color:rgba(255,255,255,.5)}
.step-line{border-color:rgba(255,255,255,.35)}
.open-story{color:#fff;border-bottom:2px solid var(--gold);padding-bottom:4px}
.story-card{border:2px solid var(--ink);border-top-width:8px;box-shadow:6px 7px 0 rgba(30,27,23,.14);position:relative;overflow:hidden}
.story-card:nth-child(1){border-top-color:var(--blue);background:var(--blue-soft)}
.story-card:nth-child(2){border-top-color:var(--olive);background:var(--olive-soft)}
.story-card:nth-child(3){border-top-color:var(--gold);background:var(--gold-soft)}
.story-card:nth-child(4){border-top-color:var(--terracotta);background:var(--terracotta-soft)}
.story-card:nth-child(5){border-top-color:var(--olive);background:var(--olive-soft)}
.story-card h3{font-size:32px}
.story-head{border-bottom:2px solid var(--ink);padding-bottom:13px}
.story-head-icon{border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(30,27,23,.13)}
.panel{border:2px solid var(--ink);border-top-width:4px;box-shadow:4px 5px 0 rgba(30,27,23,.09)}

.step{border-color:#c9bda9}
.add-step-row{border-top:1px solid #c9bda9;padding-top:12px}
.add-step-row input{border:2px solid var(--ink);border-radius:2px}
.journey{background:#f7f1e5;border-top-color:var(--blue)}
.journey-track:before{width:2px;background:var(--ink)}
.journal-entry:before{width:12px;height:12px;background:var(--terracotta);border-radius:0;transform:rotate(45deg);left:-23px}
.journal-date{color:var(--blue)}
.journal-note{font-size:23px}
/* Prevent mobile action menus and headers from escaping the viewport. */

<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark">S</div><div>Story</div></div>
  </header>

  <div class="layout">
    <aside>
      <div class="aside-kicker">Stories</div>
      <div class="story-nav" id="storyNav"></div>
      <button class="btn" id="sideAddStory" style="width:100%;margin-top:12px">＋ Add story</button>
    </aside>
    <main id="main"></main>
  </div>

  <footer class="data-footer">
    <div class="data-footer-inner">
      <div class="data-actions">
        <button class="btn text" id="sideExportBtn">⇩ Export data</button>
        <button class="btn text" id="sideImportBtn">⇧ Restore from file</button>
        <button class="btn text" id="sidePasteBtn">⇧ Paste backup</button>
        <button class="btn text" id="driveBtn">☁ Connect Google Drive</button>
        <input type="file" id="importFile" accept="application/json,.json" style="display:none">
      </div>
      <div id="storageStatus" class="storage-status"></div>
    </div>
  </footer>
</div>

<div class="modal-backdrop" id="modal">
  <div class="modal">
    <div class="modal-head"><h2 id="modalTitle"></h2><button class="close" id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="step-stamp" id="stepStamp"><strong>STEP TAKEN</strong></div>

<script>
/* ===== SECTION: persistence ===== */
const SCHEMA_VERSION = 2;
const DEFAULT_STATE = {
  schemaVersion: SCHEMA_VERSION,
  mainStoryId:null,
  quests:[],
  subs:[],
  goals:[],
  tasks:[],
  activities:[]
};

/* ---------------------------------------------------------------
   Storage layer. IndexedDB is the source of truth. The whole state
   is one document; see README (single-document decision).
   --------------------------------------------------------------- */
const DB_NAME="story-db", DB_VERSION=1, STORE="state", BACKUPS="backups", STATE_KEY="current";
const LEGACY_KEY="storyPrototypeV4";
let db=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{
      const d=req.result;
      if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);
      if(!d.objectStoreNames.contains(BACKUPS))d.createObjectStore(BACKUPS,{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function idbGet(store,key){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(store,"readonly").objectStore(store).get(key);
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
}
function idbPut(store,value,key){
  return new Promise((resolve,reject)=>{
    const os=db.transaction(store,"readwrite").objectStore(store);
    const r=key!==undefined?os.put(value,key):os.put(value);
    r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}
function idbAll(store){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(store,"readonly").objectStore(store).getAll();
    r.onsuccess=()=>resolve(r.result||[]); r.onerror=()=>reject(r.error);
  });
}
function idbDelete(store,key){
  return new Promise((resolve,reject)=>{
    const r=db.transaction(store,"readwrite").objectStore(store).delete(key);
    r.onsuccess=()=>resolve(); r.onerror=()=>reject(r.error);
  });
}

/* Keep the last 3 pre-change snapshots as a seatbelt. */
async function writeBackup(snapshot,reason){
  try{
    await idbPut(BACKUPS,{id:newId("b"),reason,at:new Date().toISOString(),state:snapshot});
    const all=(await idbAll(BACKUPS)).sort((a,b)=>b.id.localeCompare(a.id));
    for(const old of all.slice(3))await idbDelete(BACKUPS,old.id);
  }catch(e){console.warn("backup failed",e)}
}

/* Ordered migrations. v1 is the post-points baseline. v2 renames
   Goal.target to Goal.detail (same free-text field, clearer name). */
const MIGRATIONS={
  1:(s)=>{
    // Legacy states carried per-item points and goal progress. Both are gone.
    (s.activities||[]).forEach(a=>{delete a.points});
    (s.tasks||[]).forEach(t=>{delete t.points});
    (s.goals||[]).forEach(g=>{delete g.progress});
    return s;
  },
  2:(s)=>{
    (s.goals||[]).forEach(g=>{
      if(g.target!==undefined){
        if(g.detail===undefined)g.detail=g.target;
        delete g.target;
      }
    });
    return s;
  }
};
async function migrate(s){
  const from=Number(s.schemaVersion||0);
  if(from>=SCHEMA_VERSION)return s;
  await writeBackup(JSON.parse(JSON.stringify(s)),`pre-migration v${from}`);
  for(let v=from+1;v<=SCHEMA_VERSION;v++){
    if(MIGRATIONS[v])s=MIGRATIONS[v](s);
  }
  s.schemaVersion=SCHEMA_VERSION;
  return s;
}

/* Ask the browser not to evict us. Without this, IndexedDB is just as
   clearable as localStorage was. */
let persistGranted=null;
async function requestPersistence(){
  try{
    if(navigator.storage?.persisted){
      persistGranted=await navigator.storage.persisted();
      if(!persistGranted && navigator.storage.persist)persistGranted=await navigator.storage.persist();
    }
  }catch(e){persistGranted=null}
}

let state=JSON.parse(JSON.stringify(DEFAULT_STATE));
let currentStory = null;
/* Which home view is showing. Deliberately not persisted: the app should
   open on Stories, not on a list of everything outstanding. */
let homeView = "stories";

async function loadState(){
  db=await openDB();
  let migratedFromLegacy=false;
  let loaded=await idbGet(STORE,STATE_KEY);
  if(!loaded){
    // One-time migration from the old localStorage home.
    let legacy=null;
    try{legacy=localStorage.getItem(LEGACY_KEY)}catch(e){}
    if(legacy){
      // Only a genuine parse failure may discard this data. Nothing else in
      // this block is allowed to cost the user their history.
      try{loaded=JSON.parse(legacy)}catch(e){loaded=null;console.error("legacy parse failed",e)}
      if(loaded)migratedFromLegacy=true;
    }
  }
  if(loaded){
    state=await migrate(loaded);
    await idbPut(STORE,state,STATE_KEY);
  }else{
    state=JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
  return {migratedFromLegacy};
}

const attRank={max:0,active:1,available:2,background:3};

/* Debounced write so rapid edits don't thrash the DB. */
let saveTimer=null, saveFailed=false;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{
      await idbPut(STORE,state,STATE_KEY);
      saveFailed=false;
      scheduleDriveBackup();
    }catch(e){
      if(!saveFailed){saveFailed=true;toast("Could not save. Export your data.")}
      console.error("save failed",e);
    }
  },300);
}
/* ===== SECTION: derivations =====
   Pure functions of state. Everything here is testable and everything
   here is tested. New logic belongs in this band, not in a renderer. */
function q(id){return state.quests.find(x=>x.id===id)}
/* goals()/subs() are the "in play" lists, used for pickers and the
   featured goal. The Story page uses allGoals()/allSubs() so that
   completing a goal or making a chapter dormant does not hide the only
   route back to editing it. */
function goals(id){return state.goals.filter(x=>x.questId===id&&x.status!=="complete")}
function subs(id){return state.subs.filter(x=>x.questId===id&&x.status!=="dormant")}
function allGoals(id){return state.goals.filter(x=>x.questId===id)}
function allSubs(id){return state.subs.filter(x=>x.questId===id)}
function tasks(id){return state.tasks.filter(x=>x.questId===id)}
function openTasks(id){return tasks(id).filter(x=>x.status==="open")}
/* A Practice is the same record as a Step with mode:"practice". It never
   completes, it accumulates marks. Absent mode means "once", so every
   task written before this existed keeps behaving exactly as it did. */
function practices(id){return openTasks(id).filter(x=>x.mode==="practice")}
function onceSteps(id){return openTasks(id).filter(x=>x.mode!=="practice")}
/* Derived from the Journey, never stored, so the number can only ever
   reflect something that actually happened. */
function markCount(t){return state.activities.filter(a=>a.taskId===t.id).length}
/* Every open one-off step across every active Story. Practices are
   excluded on purpose: a list of practices not yet marked today is a
   list of absences. Newest first, so what surfaces is momentum rather
   than the stalest thing on the pile. */
function flatSteps(activeIds){
  return state.tasks
    .filter(t=>t.status==="open"&&t.mode!=="practice"&&activeIds.has(t.questId))
    .sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
}function marksLine(t){
  const n=markCount(t);
  if(!n)return "Ready when you are";
  if(t.lastMarkedAt===todayLocal())return `Marked today · ${n} in all`;
  return `${plural(n,"mark")} · last ${humanDate(t.lastMarkedAt||todayLocal())}`;
}
function acts(id){return state.activities.filter(x=>x.questId===id).sort((a,b)=>b.date.localeCompare(a.date))}
function latest(id){
  let d="";
  for(const a of state.activities)if(a.questId===id&&a.date>d)d=a.date;
  return d;
}
/* renderNav and renderHome both need this list, and renderHome calls
   renderNav, so it was being built twice per render. One definition. */
function activeStories(){
  const last={};
  for(const a of state.activities){
    if(!last[a.questId]||a.date>last[a.questId])last[a.questId]=a.date;
  }
  return [...state.quests].filter(x=>x.status==="active")
    .sort((a,b)=>attRank[a.attention]-attRank[b.attention]||(last[b.id]||"").localeCompare(last[a.id]||""));
}
/* Ids were newId("a"), which collides when two records are created
   in the same millisecond. That became reachable once a practice could
   be marked more than once a day: two marks, one id, and the Journey
   checkbox could not tell them apart. */
function newId(prefix){
  const rand=(globalThis.crypto&&globalThis.crypto.randomUUID)
    ? globalThis.crypto.randomUUID().slice(0,8)
    : Math.random().toString(36).slice(2,10);
  return `${prefix}-${Date.now()}-${rand}`;
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove("show"),2200);
}
/* Local calendar date as YYYY-MM-DD. Not toISOString(), which is UTC:
   after midnight in a positive-offset timezone that returns yesterday,
   which stamped completed steps with the wrong day. */
function todayLocal(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function humanDate(d){
  const today=new Date(); today.setHours(12,0,0,0);
  const date=new Date(d+"T12:00:00");
  const diff=Math.round((today-date)/86400000);
  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  if(diff<7)return diff+" days ago";
  return date.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
/* ===== SECTION: views ===== */
function renderNav(){
  const nav=document.getElementById("storyNav");
  const list=activeStories();
  nav.innerHTML=list.map(x=>`<button class="${currentStory===x.id?"active":""}" data-nav="${x.id}">
    <span class="nav-icon">${esc(x.icon)}</span><span class="nav-name">${esc(x.name)}</span>${state.mainStoryId===x.id?`<span class="nav-main">★</span>`:""}
  </button>`).join("");
  nav.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>openStory(b.dataset.nav));
}
function featuredGoal(id){return goals(id)[0]||state.goals.find(x=>x.questId===id)||null}
function renderHome(){
  currentStory=null;renderNav();
  const list=activeStories();

  if(list.length===0){
    document.getElementById("main").innerHTML=`
      ${homeHero("Start with one part of your life.","Career, Writing, Health, whatever matters to you. You can add more whenever something new comes into focus.")}
      <div class="section-rule"><span>Begin</span></div>
      ${emptyState("The page is blank.","Create your first Story to start finding your way. There's nothing else to set up first.",{page:true,extra:`<button class="btn primary" id="firstStoryBtn">＋ Create your first Story</button>`})}`;
    document.getElementById("firstStoryBtn").onclick=openAddStory;
    renderStorageStatus();
    return;
  }

  const main=q(state.mainStoryId)||list[0];
  const mainGoal=main?featuredGoal(main.id):null;
  const mainOpen=main?openTasks(main.id).slice(0,2):[];
  const others=list.filter(x=>x.id!==main?.id);
  const toggle=`
    <div class="view-toggle">
      <button class="view-tab${homeView==="stories"?" on":""}" data-view="stories">Stories</button>
      <button class="view-tab${homeView==="steps"?" on":""}" data-view="steps">Steps</button>
    </div>`;

  if(homeView==="steps"){
    /* Every open one-off step, across every active Story. Practices are
       excluded on purpose: a list of practices not yet marked today is a
       list of absences, which is the one thing this app never shows.
       Newest first, so what surfaces is momentum rather than the stalest
       thing on the pile. */
    const active=new Set(list.map(x=>x.id));
    const all=flatSteps(active);
    document.getElementById("main").innerHTML=`
      ${homeHero("What's in motion.")}
      ${toggle}
      ${all.length?`<section class="step-list flat-steps">
        ${all.map(t=>{
          const s=q(t.questId);
          return stepRow(t,{meta:s?`${esc(s.icon)} ${esc(s.name)}`:"",edit:false});
        }).join("")}
      </section>`:emptyState("Nothing queued.","Open a Story and add a step whenever one occurs to you.",{page:true})}`;
    bindMain();
    renderStorageStatus();
    return;
  }

  document.getElementById("main").innerHTML=`
    ${homeHero("What story are you writing?","Choose where to go next. Keep the direction visible. Let the steps add up to a life that feels like yours.")}
    ${toggle}

    ${main?`
    <div class="section-rule"><span>★ Main Story</span></div>
    <section class="main-story">
      <div class="main-story-left">
        <div class="story-badge"><span class="star">★</span> Main Story</div>
        <h2>${esc(main.name)}</h2>
        ${mainGoal?`<div class="goal-feature">
          <div class="goal-label">Goal</div>
          <h3>${esc(mainGoal.title)}</h3>
          ${mainGoal.detail?`<div class="goal-target">${esc(mainGoal.detail)}</div>`:""}
        </div>`:`<div class="story-subline">A story waiting for its next chapter.</div>`}
      </div>
      <div class="main-story-right">
        <div>
          <div class="mini-label">Next steps</div>
          <div class="step-teaser">
            ${mainOpen.length?mainOpen.map(t=>`<div class="step-line"><span class="step-title">${esc(t.title)}</span></div>`).join(""):`<div class="step-line"><span class="step-title">No steps queued</span></div>`}
          </div>
        </div>
        <button class="open-story" data-open-main="${main.id}">Open story →</button>
      </div>
    </section>`:""}

    <div class="section-rule"><span>Stories</span><button class="btn" id="homeAddStoryBtn">＋ Story</button></div>
    <section class="story-grid">
      ${others.map(storyCard).join("")}
    </section>`;
  bindMain();
  // Lives inside re-rendered markup, so it must be rebound on every render.
  const addBtn=document.getElementById("homeAddStoryBtn");
  if(addBtn)addBtn.onclick=openAddStory;
}
/* "1 step", "3 steps". Was written inline nine times. */
function plural(n,word,suffix="s"){return `${n} ${word}${n===1?"":suffix}`}

/* Every empty state in the app. `page` is for the full-width ones that
   stand in for a whole view rather than sitting inside a panel. */
function emptyState(title,body,{page=false,extra=""}={}){
  return `<div class="step-empty${page?" page-empty":""}">
    <div class="empty-title">${esc(title)}</div>
    <p>${esc(body)}</p>${extra}
  </div>`;
}

/* One row for a Step or a Practice. The three call sites (a Story's
   practices, a Story's steps, and the home Steps list) previously
   repeated this markup and differed only in the meta line and whether
   an edit affordance belongs there. Keeping it in one place also keeps
   the data- attributes and the handler wiring in step. */
function stepRow(t,{meta="",edit=true}={}){
  const practice=t.mode==="practice";
  const marked=practice&&t.lastMarkedAt===todayLocal();
  return `<div class="step${practice?" practice":""}">
    <button class="step-trigger${marked?" marked":""}" data-${practice?"mark":"complete"}="${t.id}" title="${practice?"Mark it":"Mark as done"}">${practice?"✓":"→"}</button>
    <div class="step-copy">
      <h4>${esc(t.title)}${practice?`<span class="practice-tag">Practice</span>`:""}</h4>
      ${practice&&t.anchor?`<div class="step-anchor">${esc(t.anchor)}</div>`:""}
      ${meta?`<div class="step-meta">${meta}</div>`:""}
    </div>
    ${edit?`<button class="icon-btn" data-edit-step="${t.id}" title="Edit ${practice?"practice":"step"}">✎</button>`:""}
  </div>`;
}
/* Every data- attribute in the app, wired in one place after a render.
   A selector that matches nothing is a no-op, so this is safe to call
   from any view. That is the point: a new view gets its wiring for free
   instead of silently rendering dead buttons, which has happened once.
   tests/binding.test.js checks this list against the markup helpers. */
function bindMain(){
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(el=>el.onclick=()=>fn(el));
  on("[data-card]",el=>openStory(el.dataset.card));
  on("[data-open-main]",el=>openStory(el.dataset.openMain));
  on("[data-view]",el=>{homeView=el.dataset.view;renderHome()});
  on("[data-complete]",el=>completeStep(el.dataset.complete));
  on("[data-mark]",el=>markPractice(el.dataset.mark));
  on("[data-edit-chapter]",el=>openEditChapter(el.dataset.editChapter));
  on("[data-edit-goal]",el=>openEditGoal(el.dataset.editGoal));
  on("[data-edit-step]",el=>openEditStep(el.dataset.editStep));
  on("[data-edit-journey]",el=>openEditJourney(el.dataset.editJourney));
  document.querySelectorAll("[data-uncomplete]").forEach(el=>el.onchange=()=>uncompleteEntry(el.dataset.uncomplete));
}
/* The home hero, written three times with only the headline and an
   optional note differing. */
function homeHero(title,note){
  return `<section class="home-hero">
    <div>
      <div class="eyebrow">Your story</div>
      <h1 class="serif-title">${esc(title)}</h1>
      ${note?`<p class="hero-note">${esc(note)}</p>`:""}
    </div>
  </section>`;
}
function storyCard(x){
  const g=featuredGoal(x.id), a=latest(x.id);
  return `<button class="story-card" data-card="${x.id}">
    <div>
      <div class="card-icon">${esc(x.icon)}</div>
      <h3>${esc(x.name)}</h3>
      <div class="card-goal-label">Goal</div>
      <div class="card-goal">${g?esc(g.title):"Choose a direction"}</div>
    </div>
    <div class="card-footer">
      <div class="card-journey">${a?`Journey · ${humanDate(a)}`:"No journey yet"}</div>
      <div class="card-open">Open →</div>
    </div>
  </button>`;
}
/* One Journey entry. Entries that came from a step or practice carry a
   ticked checkbox: unticking puts the step back, or removes that mark.
   Manually logged entries have nothing to put back, so no checkbox. */
function journalEntry(a){
  const t=a.taskId?state.tasks.find(x=>x.id===a.taskId):null;
  const label=a.kind==="practice"?"Practice marked":a.taskId?"Step completed":"Activity logged";
  return `<div class="journal-entry">
    <div class="journal-date">${humanDate(a.date)}</div>
    <div class="journal-note">${esc(a.note)}</div>
    <div class="journal-meta">
      ${t?`<label class="journal-check"><input type="checkbox" checked data-uncomplete="${a.id}"><span>${label}</span></label>`:`<span>${label}</span>`}
      <button class="icon-btn" data-edit-journey="${a.id}" title="Edit entry">✎</button>
    </div>
  </div>`;
}
/* Every delete rule in the app, in one place.

   The five delete paths each had their own hand-written copy of what
   they remove and their own hand-written sentence describing it, which
   meant the promise and the behaviour were two separate things that
   happened to agree. Now the sentence is generated from the same
   description the deletion uses, so they cannot drift.

   "unfiles" means a child keeps existing but loses its parent link. It
   is never a delete. */
const DELETE_RULES={
  chapter:{
    label:"Chapter",
    find:id=>state.subs.find(x=>x.id===id),
    name:c=>c.title,
    impact:id=>({unfiled:{goals:state.goals.filter(g=>g.subQuestId===id).length}}),
    apply:id=>{
      state.goals.forEach(g=>{if(g.subQuestId===id)g.subQuestId=null});
      state.subs=state.subs.filter(x=>x.id!==id);
    }
  },
  goal:{
    label:"Goal",
    find:id=>state.goals.find(x=>x.id===id),
    name:g=>g.title,
    impact:id=>({unfiled:{steps:state.tasks.filter(t=>t.goalId===id).length}}),
    apply:id=>{
      state.tasks.forEach(t=>{if(t.goalId===id)t.goalId=null});
      state.goals=state.goals.filter(x=>x.id!==id);
    }
  },
  step:{
    label:"Step",
    find:id=>state.tasks.find(x=>x.id===id),
    name:t=>t.title,
    /* Journey entries are deliberately kept: they record something that
       happened, which stays true after the plan is thrown away. */
    impact:()=>({}),
    apply:id=>{state.tasks=state.tasks.filter(x=>x.id!==id)}
  },
  entry:{
    label:"Journey entry",
    find:id=>state.activities.find(x=>x.id===id),
    name:a=>a.note,
    impact:()=>({}),
    apply:id=>{state.activities=state.activities.filter(x=>x.id!==id)}
  },
  story:{
    label:"Story",
    find:id=>state.quests.find(x=>x.id===id),
    name:s=>s.name,
    backup:"pre-delete-story",
    impact:id=>({removed:{
      chapters:state.subs.filter(x=>x.questId===id).length,
      goals:state.goals.filter(x=>x.questId===id).length,
      steps:state.tasks.filter(x=>x.questId===id).length,
      entries:state.activities.filter(x=>x.questId===id).length
    }}),
    apply:id=>{
      state.subs=state.subs.filter(x=>x.questId!==id);
      state.goals=state.goals.filter(x=>x.questId!==id);
      state.tasks=state.tasks.filter(x=>x.questId!==id);
      state.activities=state.activities.filter(x=>x.questId!==id);
      state.quests=state.quests.filter(x=>x.id!==id);
      if(state.mainStoryId===id)state.mainStoryId=state.quests[0]?.id||null;
    }
  }
};
function deleteImpact(kind,id){return DELETE_RULES[kind].impact(id)}
/* The confirmation sentence, built from the impact rather than written
   alongside it. */
function deleteMessage(kind,id){
  const rule=DELETE_RULES[kind];
  const subject=rule.find(id);
  if(!subject)return "";
  const impact=rule.impact(id);
  let msg=`Delete <strong>${esc(rule.name(subject))}</strong>`;
  if(impact.removed){
    const r=impact.removed;
    msg+=` and everything in it: ${plural(r.chapters,"chapter")}, ${plural(r.goals,"goal")}, `+
      `${plural(r.steps,"step")} and ${r.entries} journey entr${r.entries===1?"y":"ies"}. `+
      `This cannot be undone from inside the app, so a backup is saved first.`;
    return msg;
  }
  msg+="?";
  if(impact.unfiled){
    if(impact.unfiled.goals)msg+=` Its ${plural(impact.unfiled.goals,"goal")} will stay in this Story, just without a chapter.`;
    if(impact.unfiled.steps)msg+=` Its ${plural(impact.unfiled.steps,"step")} will stay in this Story, just without a goal.`;
  }
  if(kind==="step")msg+=" Anything already recorded in your Journey stays.";
  if(kind==="entry")msg+=" This is a record of something you did.";
  return msg;
}
async function applyDelete(kind,id){
  const rule=DELETE_RULES[kind];
  if(!rule.find(id))return false;
  if(rule.backup)await writeBackup(JSON.parse(JSON.stringify(state)),rule.backup);
  rule.apply(id);
  return true;
}

function stepContext(t){
  const g=state.goals.find(x=>x.id===t.goalId);
  const c=g?state.subs.find(s=>s.id===g.subQuestId):null;
  return [c?.title,g?.title].filter(Boolean).map(esc).join(" · ")||"A step in this Story";
}
/* Groups a Story's goals under their Chapter. Was an inline IIFE inside
   openStory's template literal; pulled out so the grouping rule can be
   tested without rendering anything. */
function goalsByChapter(chapters,goals){
  return chapters.map(s=>({chapter:s,goals:goals.filter(g=>g.subQuestId===s.id)}));
}
/* A goal is loose if it has no chapter, or points at a chapter that no
   longer exists (deleting a Chapter nulls subQuestId on its goals, but
   an import or a future bug could leave a dangling id). */
function looseGoals(chapters,goals){
  return goals.filter(g=>!g.subQuestId||!chapters.some(s=>s.id===g.subQuestId));
}
function showStamp(label){
  const stamp=document.getElementById("stepStamp");
  stamp.querySelector("strong").textContent=label||"STEP TAKEN";
  stamp.classList.add("show"); setTimeout(()=>stamp.classList.remove("show"),1700);
}
/* Marking a Practice writes to the Journey but leaves the record open.
   Marks are not limited per day: the count is a record of times, not of
   days. Nothing here can produce a miss, since an unmarked day simply
   has no entry. */
function markPractice(id){
  const t=state.tasks.find(x=>x.id===id);if(!t||t.mode!=="practice")return;
  const today=todayLocal();
  t.lastMarkedAt=today;
  state.activities.push({id:newId("a"),questId:t.questId,taskId:t.id,kind:"practice",note:t.title,date:today});
  save(); showStamp("PRACTICE MARKED"); currentStory?openStory(currentStory):renderHome();
}
/* The date of a practice's most recent surviving mark, or null. Used to
   recompute lastMarkedAt after an entry is removed, so the trigger's
   marked-today state always reflects entries that actually exist. */
function lastMarkFor(taskId){
  let d=null;
  for(const a of state.activities){
    if(a.taskId===taskId&&(!d||a.date>d))d=a.date;
  }
  return d;
}
/* Unticking a Journey entry. For a step this reopens it; for a practice
   mark it just removes that mark. Either way the entry goes, and the
   practice's lastMarkedAt is recomputed from what remains rather than
   cleared, so removing an older mark does not wrongly un-mark today. */
function uncompleteEntry(entryId){
  const a=state.activities.find(x=>x.id===entryId); if(!a)return;
  const t=a.taskId?state.tasks.find(x=>x.id===a.taskId):null;
  /* No step or practice behind it means nothing to put back. Removing it
     here would be a delete with no confirmation, reached through a
     control that isn't a delete. Manual entries are removed through the
     edit modal instead. */
  if(!t)return;
  state.activities=state.activities.filter(x=>x.id!==entryId);
  if(t.mode==="practice"){
    t.lastMarkedAt=lastMarkFor(t.id);
  }else{
    t.status="open";
    delete t.completedAt;
  }
  save(); currentStory?openStory(currentStory):renderHome();
}
function completeStep(id){
  const t=state.tasks.find(x=>x.id===id);if(!t||t.status==="complete")return;
  if(t.mode==="practice")return markPractice(id);
  t.status="complete";t.completedAt=todayLocal();
  state.activities.push({id:newId("a"),questId:t.questId,taskId:t.id,note:t.title,date:t.completedAt});
  save(); showStamp(); currentStory?openStory(currentStory):renderHome();
}

   Deleting a parent never destroys its children: a Goal outlives its
   Chapter, a Step outlives its Goal, and a Journey entry outlives the

   actually happened. Only deleting a Story cascades, and that asks

function validateImport(obj){

  return null;
}

  showModal("Paste backup",`
    <p style="margin:0 0 10px;font-size:14px;color:var(--muted)">Paste the text from an export below. Useful when moving between browsers, where a downloaded file isn't easy to hand over.</p>
    <textarea id="pasteText" placeholder="Paste your exported Story data here" style="width:100%;height:140px;font-family:monospace;font-size:11px"></textarea>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="loadPaste">Continue</button></div>`);
  document.getElementById("loadPaste").onclick=()=>{
    const raw=document.getElementById("pasteText").value.trim();
    if(!raw){toast("Paste your data first");return}
    let parsed;
    try{parsed=JSON.parse(raw)}
    catch(e){toast("That doesn't look like Story data");return}
    confirmRestore(parsed);
  };
}
function confirmRestore(parsed){
  const problem=validateImport(parsed);
  if(problem){toast(problem);return}
  const counts=`${parsed.quests.length} ${parsed.quests.length===1?"Story":"Stories"}, ${parsed.activities.length} Journey ${parsed.activities.length===1?"entry":"entries"}`;
  const when=parsed.exportedAt?new Date(parsed.exportedAt).toLocaleDateString():"an unknown date";
  showModal("Restore",`
    <p style="margin:0 0 6px;font-size:14px">This will <strong>replace</strong> everything currently in Story with this data.</p>
    <p style="margin:0 0 14px;font-size:14px;color:var(--muted)">Restoring ${counts}, exported ${esc(when)}. Your current data is backed up first, in case you need it.</p>
    <div class="modal-footer"><button class="btn" id="cancelModal">Cancel</button><button class="btn primary" id="confirmRestoreBtn">Replace my data</button></div>`);
  document.getElementById("confirmRestoreBtn").onclick=async()=>{
    await writeBackup(JSON.parse(JSON.stringify(state)),"pre-restore");
    state=await migrate(parsed);
    await idbPut(STORE,state,STATE_KEY);
    closeModal();renderHome();toast("Story restored");
  };
}
async function exportData(){
  state.exportedAt=new Date().toISOString();
  save();
  const payload=JSON.stringify(state,null,2);
  const filename=`story-export-${todayLocal()}.json`;

  // 1. Share sheet. Most reliable route on Android: lets the file go
  //    straight to Drive, Files, email etc.
  try{
    const file=new File([payload],filename,{type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Story backup"});
      renderStorageStatus();
      return;
    }
  }catch(e){
    if(e && e.name==="AbortError"){renderStorageStatus();return}
    // any other share failure falls through to the routes below
  }

  // 2. Anchor download. Can be silently blocked by some mobile browsers,
  //    and there is no way to detect that, so it is never the last resort.
  try{
    const url=URL.createObjectURL(new Blob([payload],{type:"application/json"}));
    const a=document.createElement("a");
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},4000);
  }catch(e){console.error("download failed",e)}

  // 3. Always offer the raw text too. This is the one route that cannot
  //    fail: a blocked download otherwise looks identical to a working one.
  showExportFallback(payload,filename);
  renderStorageStatus();
}
function showExportFallback(payload,filename){
  showModal("Your data",`
    <p style="margin:0 0 6px;font-size:14px">A download of <strong>${esc(filename)}</strong> was started. Check your Downloads.</p>
    <p style="margin:0 0 10px;font-size:14px;color:var(--muted)">If nothing downloaded, copy the text below and save it somewhere safe. This is your complete Story, and it can be pasted back in using Restore.</p>
    <textarea id="exportText" readonly style="width:100%;height:140px;font-family:monospace;font-size:11px">${esc(payload)}</textarea>
    <div class="modal-footer"><button class="btn" id="cancelModal">Close</button><button class="btn primary" id="copyExport">Copy to clipboard</button></div>`);
  document.getElementById("copyExport").onclick=async()=>{
    const ta=document.getElementById("exportText");
    try{
      await navigator.clipboard.writeText(payload);
      toast("Copied, now paste it somewhere safe");
    }catch(e){
      // Clipboard API needs a secure context and permission; selecting the
      // text at least lets the user copy it by hand.
      ta.focus();ta.select();
      toast("Select all and copy manually");
    }
  };
}
document.getElementById("sideAddStory").onclick=openAddStory;
document.getElementById("sideExportBtn").onclick=exportData;
document.getElementById("sideImportBtn").onclick=()=>document.getElementById("importFile").click();
document.getElementById("sidePasteBtn").onclick=openPasteRestore;
document.getElementById("driveBtn").onclick=()=>{
  if(!driveEnabled()){connectDrive();return}
  showModal("Google Drive",`
    <p style="margin:0 0 6px;font-size:14px">Story keeps a backup in a <strong>Story</strong> folder in your Drive, which you can open and copy yourself.</p>
    <p style="margin:0 0 14px;font-size:14px;color:var(--muted)">Your Story still lives on this device. Drive is only a copy.</p>
    <div class="modal-footer"><button class="btn" id="driveOff">Disconnect</button><button class="btn primary" id="driveNow">Back up now</button></div>`);
  document.getElementById("driveNow").onclick=async()=>{closeModal();toast("Backing up");await backupToDrive(true)};
  document.getElementById("driveOff").onclick=()=>{closeModal();disconnectDrive()};
};
document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(f)importData(f); e.target.value="";
});

/* ---- Google Drive backup (optional layer) ------------------------------
   Drive is a backup destination, never the source of truth. Every failure
   here is non-fatal: the app must keep working offline with no account.
   Uses the GIS token flow, which issues short-lived tokens and no refresh
   token, so reconnecting periodically is expected rather than a bug.     */
const DRIVE_CLIENT_ID="290703972261-enfbstren9qjvsiej880fopdgcijii6h.apps.googleusercontent.com";
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.file";
const DRIVE_FOLDER="Story";
const DRIVE_CURRENT="story-current.json";
const DRIVE_KEEP_DATED=3;
let driveToken=null, driveTokenExpiry=0, driveTokenClient=null, driveBackupTimer=null, driveBusy=false, driveError=null;

function driveEnabled(){return !!state.driveEnabled}
function loadGsi(){
  if(window.google?.accounts?.oauth2)return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const existing=document.getElementById("gsiScript");
    if(existing){existing.addEventListener("load",()=>resolve());existing.addEventListener("error",reject);return}
    const s=document.createElement("script");
    s.id="gsiScript";s.src="https://accounts.google.com/gsi/client";s.async=true;s.defer=true;
    s.onload=()=>resolve();s.onerror=()=>reject(new Error("Could not load Google sign-in"));
    document.head.appendChild(s);
  });
}
function readStoredToken(){
  // sessionStorage, not IndexedDB: the token should die with the session
  // rather than being persisted alongside the user's Story.
  try{
    const raw=sessionStorage.getItem("storyDriveToken");
    if(!raw)return false;
    const t=JSON.parse(raw);
    if(t&&t.token&&Date.now()<t.expiry-60000){driveToken=t.token;driveTokenExpiry=t.expiry;return true}
  }catch(e){}
  return false;
}
function storeToken(){
  try{sessionStorage.setItem("storyDriveToken",JSON.stringify({token:driveToken,expiry:driveTokenExpiry}))}catch(e){}
}
function haveLiveToken(){
  if(driveToken&&Date.now()<driveTokenExpiry-60000)return true;
  return readStoredToken();
}
async function getDriveToken(interactive){
  if(haveLiveToken())return driveToken;
  // Without an explicit request, never open a sign-in popup. GIS shows a
  // window even for a silent refresh, which turns every page refresh into
  // a sign-in prompt.
  if(!interactive)throw new Error("Reconnect to back up");
  await loadGsi();
  return new Promise((resolve,reject)=>{
    if(!driveTokenClient){
      driveTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:DRIVE_CLIENT_ID, scope:DRIVE_SCOPE, callback:()=>{}
      });
    }
    driveTokenClient.callback=(resp)=>{
      if(resp.error||!resp.access_token){reject(new Error(resp.error||"No access token"));return}
      driveToken=resp.access_token;
      driveTokenExpiry=Date.now()+(Number(resp.expires_in||3600)*1000);
      storeToken();
      resolve(driveToken);
    };
    driveTokenClient.error_callback=(err)=>reject(new Error(err?.type||"Authorisation cancelled"));
    driveTokenClient.requestAccessToken({prompt:""});
  });
}
async function driveFetch(url,opts={}){
  const token=await getDriveToken(false);
  const res=await fetch(url,{...opts,headers:{Authorization:"Bearer "+token,...(opts.headers||{})}});
  if(res.status===401){
    driveToken=null;driveTokenExpiry=0;
    try{sessionStorage.removeItem("storyDriveToken")}catch(e){}
    throw new Error("Reconnect to back up");
  }
  if(!res.ok)throw new Error("Drive request failed ("+res.status+")");
  return res;
}
async function driveFetch(url,opts={}){
  const token=await getDriveToken(false);
  const res=await fetch(url,{...opts,headers:{Authorization:"Bearer "+token,...(opts.headers||{})}});
  if(res.status===401){driveToken=null;driveTokenExpiry=0;throw new Error("Drive authorisation expired")}
  if(!res.ok)throw new Error("Drive request failed ("+res.status+")");
  return res;
}
async function driveFolderId(){
  const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res=await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data=await res.json();
  if(data.files&&data.files.length)return data.files[0].id;
  const made=await driveFetch("https://www.googleapis.com/drive/v3/files",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:DRIVE_FOLDER,mimeType:"application/vnd.google-apps.folder"})
  });
  return (await made.json()).id;
}
async function driveListInFolder(folderId){
  const q=encodeURIComponent(`'${folderId}' in parents and trashed=false`);
  const res=await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&orderBy=name`);
  return (await res.json()).files||[];
}
async function driveUpload(folderId,name,payload,existingId){
  if(existingId){
    return driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=media`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:payload
    });
  }
  const boundary="story"+Date.now();
  const meta=JSON.stringify({name,parents:[folderId]});
  const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n`+
             `--${boundary}\r\nContent-Type: application/json\r\n\r\n${payload}\r\n--${boundary}--`;
  return driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{
    method:"POST",headers:{"Content-Type":`multipart/related; boundary=${boundary}`},body
  });
}
/* Chooses which dated snapshots to delete. Pure, so it can be tested. */
function datedToDelete(files,keep){
  const dated=files.filter(f=>/^story-\d{4}-\d{2}-\d{2}\.json$/.test(f.name))
                   .sort((a,b)=>a.name.localeCompare(b.name));
  return dated.slice(0,Math.max(0,dated.length-keep));
}
async function backupToDrive(force){
  if(!driveEnabled()||driveBusy)return;
  if(navigator.onLine===false)return;
  // Automatic backups must stay silent. Without a live token, wait for the
  // user rather than interrupting them with a sign-in window.
  if(!force&&!haveLiveToken()){driveError="Reconnect to back up";renderStorageStatus();return}
  driveBusy=true;
  try{
    if(force)await getDriveToken(true);
    const payload=JSON.stringify(state,null,2);
    const folderId=await driveFolderId();
    const files=await driveListInFolder(folderId);
    const current=files.find(f=>f.name===DRIVE_CURRENT);
    await driveUpload(folderId,DRIVE_CURRENT,payload,current?.id);
    const datedName=`story-${todayLocal()}.json`;
    const sameDay=files.find(f=>f.name===datedName);
    await driveUpload(folderId,datedName,payload,sameDay?.id);
    for(const old of datedToDelete(files.concat(sameDay?[]:[{name:datedName}]),DRIVE_KEEP_DATED)){
      if(old.id)await driveFetch(`https://www.googleapis.com/drive/v3/files/${old.id}`,{method:"DELETE"}).catch(()=>{});
    }
    state.driveBackupAt=new Date().toISOString();
    driveError=null;
    // Direct write, NOT save(): save() schedules a Drive backup, which would
    // re-enter here every 8 seconds forever.
    try{await idbPut(STORE,state,STATE_KEY)}catch(e){console.error("save after backup failed",e)}
  }catch(e){
    console.error("drive backup failed",e);
    driveError=e.message||"Backup failed";
  }finally{
    driveBusy=false;
    renderStorageStatus();
  }
}
function scheduleDriveBackup(){
  if(!driveEnabled())return;
  clearTimeout(driveBackupTimer);
  driveBackupTimer=setTimeout(backupToDrive,8000);
}
async function connectDrive(){
  try{
    await getDriveToken(true);
    state.driveEnabled=true;driveError=null;save();
    toast("Connected, backing up now");
    await backupToDrive(true);
    renderStorageStatus();
  }catch(e){
    console.error("drive connect failed",e);
    toast(e.message==="Could not load Google sign-in"?"Couldn't reach Google, are you online?":"Drive not connected");
  }
}
function disconnectDrive(){
  state.driveEnabled=false;driveError=null;driveToken=null;driveTokenExpiry=0;
  try{sessionStorage.removeItem("storyDriveToken")}catch(e){}
  save();renderStorageStatus();
  toast("Drive disconnected, your Story stays on this device");
}

function renderStorageStatus(){
  const el=document.getElementById("storageStatus"); if(!el)return;
  const bits=[];
  if(state.exportedAt){
    const days=Math.floor((Date.now()-new Date(state.exportedAt))/86400000);
    bits.push(days===0?"Exported today":days===1?"Exported yesterday":`Exported ${days} days ago`);
    if(days>=14)bits.push("Worth exporting again");
  }else{
    bits.push("Never exported");
  }
  if(persistGranted===false)bits.push("Storage not protected by this browser");
  if(driveEnabled()){
    if(driveError)bits.push("Drive: "+driveError);
    else if(state.driveBackupAt){
      const mins=Math.floor((Date.now()-new Date(state.driveBackupAt))/60000);
      bits.push(mins<2?"Backed up to Drive just now":mins<60?`Backed up to Drive ${mins} min ago`:
        Math.floor(mins/60)<24?`Backed up to Drive ${Math.floor(mins/60)}h ago`:"Backed up to Drive "+new Date(state.driveBackupAt).toLocaleDateString());
    }else bits.push("Drive connected");
  }
  el.textContent=bits.join(" · ");
  const btn=document.getElementById("driveBtn");
  if(btn)btn.textContent=!driveEnabled()?"☁ Connect Google Drive":
    (haveLiveToken()?"⛭ Drive connected":"☁ Tap to back up to Drive");
}

(async function boot(){
  let result={};
  try{
    result=await loadState();
  }catch(e){
    console.error("load failed",e);
    toast("Could not open local storage");
  }
  await requestPersistence();
  renderHome();
  renderStorageStatus();
  if(result.migratedFromLegacy)toast("Your data has been moved to safer storage");
  // Drive is optional and must never delay or block startup.
  if(driveEnabled())setTimeout(()=>{backupToDrive().catch(()=>{})},2000);
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
</script>
